<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · HelpDesk</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="pagina-auth">
    <div class="caixa-auth">
      <h1><span class="marca">HelpDesk</span> · Entrar</h1>
      <p id="aviso-cadastro" class="aviso-sucesso oculto">Conta criada! Faca login para continuar.</p>
      <p id="mensagem-erro" class="erro-msg oculto"></p>
      <form id="form-login">
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <label for="senha">Senha</label>
        <input type="password" id="senha" required>
        <button type="submit" class="btn" style="width:100%;">Entrar</button>
      </form>
      <p class="link-secundario">Nao tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>
  </div>
  <script>
    if (new URLSearchParams(window.location.search).get('cadastrado')) {
      document.getElementById('aviso-cadastro').classList.remove('oculto');
    }
  </script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
