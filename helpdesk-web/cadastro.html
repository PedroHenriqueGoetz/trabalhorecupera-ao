<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta · HelpDesk</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="pagina-auth">
    <div class="caixa-auth">
      <h1><span class="marca">HelpDesk</span> · Criar conta</h1>
      <p id="mensagem-erro" class="erro-msg oculto"></p>
      <form id="form-registro">
        <label for="nome">Nome</label>
        <input type="text" id="nome" required>
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <label for="senha">Senha</label>
        <input type="password" id="senha" minlength="6" required>
        <label for="papel">Tipo de conta</label>
        <select id="papel">
          <option value="cliente">Cliente</option>
          <option value="tecnico">Tecnico</option>
        </select>
        <button type="submit" class="btn" style="width:100%;">Criar conta</button>
      </form>
      <p class="link-secundario">Ja tem conta? <a href="index.html">Entrar</a></p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
